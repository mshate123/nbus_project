apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: nbus-ledger
data:
  database-url: "postgresql+asyncpg://ledger:ledger@postgres:5432/ledger"
  aws-endpoint-url: "http://localstack:4566"
  aws-default-region: "us-east-1"
  s3-bucket-statements: "ledger-statements"
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: nbus-ledger
type: Opaque
stringData:
  aws-access-key-id: "test"
  aws-secret-access-key: "test"
  auth-stub-token: "dev-token"
